<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>버섯 생육 시뮬레이션 뷰어</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --bg:#0b0e11; --card:#141a20; --line:#213040; --text:#e9f0f5; --muted:#9fb0c0; --panel:#0e1319;
  --radius:14px; --inc:5pt; --header-h:72px; --gap:12px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui, Arial, "Noto Sans KR";font-size:calc(16px + var(--inc));line-height:1.5;overflow:hidden;
}

/* 헤더 */
header{
  height:var(--header-h);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:8px 16px;border-bottom:1px solid #16202a;
}
h1{margin:0;font-size:calc(27px + var(--inc))}
.sub{color:var(--muted);font-size:calc(12px + var(--inc))}
.toolbar{display:flex;gap:10px}
.btn{
  padding:8px 12px;border-radius:12px;border:1px solid #2a3847;
  background:#0f141a;color:var(--text);cursor:pointer;font-size:calc(14px + var(--inc));
}
.btn:hover{border-color:#415e7a}

/* 메인 레이아웃 */
main{
  display:grid;
  grid-template-columns: 25% 50% 25%;
  height:calc(100vh - var(--header-h));
  gap:var(--gap);
  padding:var(--gap);
}

/* 좌측 환경패널 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;overflow:auto;
}
h2{margin:8px 0;font-size:calc(16px + var(--inc))}
label{font-size:calc(12px + var(--inc));display:block;margin:8px 0 6px;color:var(--muted)}
select{
  width:100%;padding:8px 10px;border-radius:10px;
  background:#0f141a;color:#fff;border:1px solid #2a3847;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:calc(11px + var(--inc));color:var(--muted);margin-top:8px;line-height:1.45;word-break:break-all}

/* 토글 스위치 */
.extrasHeader{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.toggleWrap{display:flex;align-items:center;gap:8px;cursor:pointer;}
.toggleLabel{font-size:13px;color:var(--muted);}
.toggleBtn{width:50px;height:24px;border-radius:999px;background:#2a3847;position:relative;transition:0.3s;}
.toggleBtn::before{content:'';position:absolute;top:3px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:0.3s;}
.toggleBtn.on{background:#2b4e68;}
.toggleBtn.on::before{left:calc(100% - 22px);}
.toggleState{font-size:12px;color:#9fb0c0;margin-left:6px;}

/* 중앙 플레이어 */
.stack{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:var(--gap);
}
.vcard{
  background:#0e1319;border:1px solid #1e2a36;border-radius:var(--radius);
  width:90%;max-width:960px;padding:8px;display:flex;flex-direction:column;align-items:center;
}
.vtitle{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#cfe1f3;font-size:calc(13px + var(--inc))}
.badge{font-size:12px;padding:2px 8px;border:1px solid #32516d;border-radius:999px;color:#d5e9ff}
.vmedia video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;object-fit:contain;}
.status{font-size:12px;color:var(--muted);margin-top:4px;}

/* 우측 매뉴얼 */
.sidepanel{
  background:var(--panel);border-left:1px solid #1c2a38;padding:12px;
  overflow:auto;border-radius:var(--radius);
}
.sidepanel h3{margin-top:0;color:#cfe3f7}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.imgs img{width:100%;border-radius:8px;border:1px solid #25374a;object-fit:cover;height:100px;}

/* 우측 하단 로고 */
.brandDock{
  position:fixed;right:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:10px;
  background:rgba(20,26,32,0.85);border:1px solid #2a3847;padding:8px 12px;border-radius:12px;
}
.brandName{font-weight:700;font-size:18px;}
.brandLogo{height:80px;width:auto;}
</style>
</head>
<body>
<header>
  <div>
    <h1>버섯 생육 시뮬레이션</h1>
    <div class="sub">상단: 표준 영상 자동 재생 · 하단: 선택 조건 비교 재생 · 우측: 표준 매뉴얼</div>
  </div>
  <div class="toolbar">
    <button id="openManual" class="btn">재배 매뉴얼 열기</button>
    <button id="playBoth" class="btn">둘다 재생</button>
    <button id="pauseBoth" class="btn">둘다 정지</button>
    <button id="syncTime" class="btn">동기화</button>
  </div>
  <div class="brandDock"><span class="brandName">경기도농업기술원</span><img src="assets/경기도심볼.jpg" class="brandLogo" /></div>
</header>

<main>
  <!-- 좌측 환경 설정 -->
  <section class="card">
    <h2>Stage1</h2>
    <div class="row">
      <div><label>온도(°C)</label><select id="s1temp"><option>13</option><option selected>18</option><option>23</option></select></div>
      <div><label>광</label><select id="s1light"><option selected>on</option><option>off</option></select></div>
    </div>
    <h2>Stage2</h2>
    <div class="row">
      <div><label>온도(°C)</label><select id="s2temp"><option>15</option><option selected>18</option></select></div>
      <div><label>습도(%)</label><select id="s2hum"><option>60</option><option selected>80</option><option>90</option></select></div>
    </div>

    <div class="extrasHeader">
      <h2 style="margin:0;">추가 보기 (환경조건 무관)</h2>
      <div class="toggleWrap" id="extrasToggle">
        <div class="toggleLabel">비교에 적용</div>
        <div class="toggleBtn" id="extrasBtn"></div>
        <div class="toggleState" id="extrasState">OFF</div>
      </div>
    </div>
    <p style="font-size:12px;color:#9fb0c0;">OFF: 환경조합 기본 / ON: 추가 보기(품질·노화·배지·솎기단독)로 비교</p>

    <div class="row">
      <div><label>품질</label><select id="quality"><option>none</option><option>quality_excellent</option><option>quality_high</option><option>quality_normal</option></select></div>
      <div><label>노화</label><select id="aging"><option>none</option><option>15</option><option>18</option><option>both</option></select></div>
    </div>
  </section>

  <!-- 중앙 플레이어 -->
  <section class="stack">
    <div class="vcard">
      <div class="vtitle">기준 플레이어 <span class="badge">표준 영상</span></div>
      <div class="vmedia"><video id="stdPlayer" controls muted autoplay playsinline webkit-playsinline></video></div>
      <div id="stdStatus" class="status"></div>
    </div>
    <div class="vcard">
      <div class="vtitle">비교 플레이어 <span class="badge">선택 조건</span></div>
      <div class="vmedia"><video id="cmpPlayer" controls muted autoplay playsinline webkit-playsinline></video></div>
      <div id="cmpStatus" class="status"></div>
    </div>
  </section>

  <!-- 우측 매뉴얼 -->
  <aside class="sidepanel" id="panel">
    <h3>표준 매뉴얼</h3>
    <div class="stage"><h4>① 입상(개봉)</h4>
      <div class="imgs"><img src="assets/입상(개봉)_1.jpg"><img src="assets/입상(개봉)_2.jpg"></div>
      <p>배지를 개봉하고 생육 준비 단계 시작</p></div>
    <div class="stage"><h4>② 발이 후 생육</h4><div class="imgs"><img src="assets/발이 후 생육.jpg"></div></div>
    <div class="stage"><h4>③ 솎기</h4><div class="imgs"><img src="assets/솎기.jpg"></div></div>
  </aside>
</main>

<script>
const base="assets/videos";
const std=document.getElementById("stdPlayer");
const cmp=document.getElementById("cmpPlayer");
const stdStatus=document.getElementById("stdStatus");
const cmpStatus=document.getElementById("cmpStatus");
const extrasBtn=document.getElementById("extrasBtn");
const extrasState=document.getElementById("extrasState");
const openManual=document.getElementById("openManual");
const panel=document.getElementById("panel");

openManual.addEventListener("click",()=>{panel.scrollIntoView({behavior:"smooth"});});

let extrasOn=false;
document.getElementById("extrasToggle").addEventListener("click",()=>{
  extrasOn=!extrasOn;
  extrasBtn.classList.toggle("on",extrasOn);
  extrasState.textContent=extrasOn?"ON":"OFF";
  cmpStatus.textContent=extrasOn?"비교 모드: 추가 보기":"기본 비교 모드";
  loadVideo();
});

async function fileExists(url){try{return (await fetch(url,{method:"HEAD"})).ok}catch{return false}}
async function ensurePlay(p){try{p.muted=true;p.setAttribute("playsinline","");await p.play();}catch{}}

async function loadVideo(){
  const stdPath=`${base}/mushroom_S1T18_H90_Lon_S2T15_H80_Lon_T10.mp4`;
  const cmpPath=extrasOn?`${base}/aging/aging-15.mp4`:`${base}/quality/quality_excellent.mp4`;
  if(await fileExists(stdPath)){std.src=stdPath;stdStatus.textContent="표준 영상 재생";}
  if(await fileExists(cmpPath)){cmp.src=cmpPath;cmpStatus.textContent="비교 영상 재생";}
  await ensurePlay(std);await ensurePlay(cmp);
}
loadVideo();

document.getElementById("playBoth").addEventListener("click",()=>{std.play();cmp.play();});
document.getElementById("pauseBoth").addEventListener("click",()=>{std.pause();cmp.pause();});
document.getElementById("syncTime").addEventListener("click",()=>{cmp.currentTime=std.currentTime;});
</script>
</body>
</html>
