<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>버섯 생육 시뮬레이션 뷰어</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root {
  --bg:#0b0e11; --card:#141a20; --line:#213040; --text:#e9f0f5; --muted:#9fb0c0;
  --radius:14px; --inc:5pt;
  --header-h:72px;
  --gap:16px;
}

/* ===== 기본 설정 ===== */
*{box-sizing:border-box}
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,"Noto Sans KR";
  overflow:hidden;
}

/* ===== 헤더 ===== */
header {
  height:var(--header-h);
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid #1a2835; padding:8px 16px;
}
h1 {margin:0; font-size:calc(26px + var(--inc))}
.sub {color:var(--muted); font-size:14px}
.toolbar {display:flex; gap:8px}
.btn {
  padding:6px 10px; border-radius:10px;
  border:1px solid #2a3847; background:#0f141a; color:var(--text);
  cursor:pointer;
}
.btn:hover {border-color:#415e7a}

/* ===== 메인 3분할 레이아웃 ===== */
main {
  display:grid;
  grid-template-columns: 28% 50% 22%; /* 좌-중-우 비율 */
  height:calc(100vh - var(--header-h));
  gap:var(--gap);
  padding:var(--gap);
  align-items:stretch;
  overflow:hidden;
}

/* ===== 좌측 환경 패널 ===== */
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
  overflow:auto;
}
h2{margin:8px 0 6px; font-size:calc(15px + var(--inc))}
label{font-size:calc(12px + var(--inc)); color:var(--muted)}
select{
  width:100%; padding:6px 8px; border-radius:8px;
  background:#0f141a; color:#fff; border:1px solid #2a3847;
}
.row{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* ===== 중앙 플레이어 ===== */
.centerStack{
  display:grid; grid-template-rows:1fr 1fr; gap:var(--gap);
  background:#0f141a; border:1px solid #25374a; border-radius:var(--radius);
  padding:10px; overflow:hidden;
}
.vcard{
  display:flex; flex-direction:column;
  background:#101821; border-radius:12px; border:1px solid #25374a;
  padding:8px; overflow:hidden;
}
.vtitle{color:#cfe1f3; margin-bottom:4px;}
.vmedia{flex:1; display:flex; justify-content:center; align-items:center; overflow:hidden;}
.vw{width:100%; max-width:100%; height:100%; display:flex; justify-content:center; align-items:center;}
.vw video{width:95%; height:100%; object-fit:contain; border-radius:10px; background:#000;}
.status{font-size:12px; color:var(--muted); min-height:1.2em;}

/* ===== 우측 매뉴얼 ===== */
.sidepanel{
  background:#0e1319; border:1px solid #1e2a36; border-radius:var(--radius);
  overflow:auto; padding:10px;
}
.sidepanel h3{margin:6px 0; font-size:15px;}
.imgs{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
.imgs img{width:100%; border-radius:8px; border:1px solid #25374a;}
.kv{display:grid; grid-template-columns:90px 1fr; color:#b1c0cf; font-size:13px; margin-top:4px;}
.kv b{color:#e8f1f8}

/* ===== 브랜드 Dock ===== */
.brandDock{
  position:fixed; right:20px; bottom:16px;
  display:flex; align-items:center; gap:12px;
  background:rgba(20,26,32,0.85); border:1px solid #2a3847;
  padding:8px 12px; border-radius:12px; backdrop-filter:blur(3px);
}
.brandName{font-weight:800; font-size:calc(14px + var(--inc) + 3px); color:#fff;}
.brandLogo{height:114px; width:auto; border-radius:6px; object-fit:contain;}

/* ===== 반응형 ===== */
@media (max-width: 1200px){
  main{grid-template-columns:1fr; grid-template-rows:auto auto auto; overflow:auto;}
  body{overflow:auto;}
}
</style>
</head>

<body>
<header>
  <div>
    <h1>버섯 생육 시뮬레이션</h1>
    <div class="sub">좌: 환경 설정 · 중: 영상 비교 · 우: 표준 매뉴얼</div>
  </div>
  <div class="toolbar">
    <button id="playBoth" class="btn">재생</button>
    <button id="pauseBoth" class="btn">정지</button>
  </div>
</header>

<main>
  <!-- 좌측 환경 패널 -->
  <section class="card">
    <h2>Stage1</h2>
    <div class="row">
      <div><label>온도(°C)</label><select id="s1temp"><option>13</option><option selected>18</option><option>23</option></select></div>
      <div><label>광</label><select id="s1light"><option selected>on</option><option>off</option></select></div>
    </div>
    <h2>Stage2</h2>
    <div class="row">
      <div><label>온도(°C)</label><select id="s2temp"><option>15</option><option selected>18</option></select></div>
      <div><label>습도(%)</label><select id="s2hum"><option>60</option><option selected>80</option><option>90</option></select></div>
    </div>
    <h2>추가 보기</h2>
    <div class="row">
      <div><label>품질</label><select id="quality"><option value="none" selected>—</option><option value="quality_excellent">특상</option></select></div>
      <div><label>노화</label><select id="aging"><option value="none" selected>—</option><option value="15">aging-15</option><option value="18">aging-18</option></select></div>
    </div>
  </section>

  <!-- 중앙 플레이어 -->
  <section class="centerStack">
    <div class="vcard">
      <div class="vtitle">기준 플레이어</div>
      <div class="vmedia"><div class="vw"><video id="stdPlayer" controls muted autoplay playsinline webkit-playsinline></video></div></div>
      <div id="stdStatus" class="status"></div>
    </div>
    <div class="vcard">
      <div class="vtitle">비교 플레이어</div>
      <div class="vmedia"><div class="vw"><video id="cmpPlayer" controls muted autoplay playsinline webkit-playsinline></video></div></div>
      <div id="cmpStatus" class="status"></div>
    </div>
  </section>

  <!-- 우측 매뉴얼 -->
  <aside id="panel" class="sidepanel">
    <h3>표준 매뉴얼</h3>
    <div class="imgs">
      <img src="assets/입상(개봉)%201.jpg" alt="입상(개봉) 1">
      <img src="assets/입상(개봉)%202.jpg" alt="입상(개봉) 2">
    </div>
    <div class="kv"><b>설명</b><span>배지를 개봉하고 생육 준비 단계 시작</span></div>
  </aside>
</main>

<!-- 하단 브랜드 -->
<div class="brandDock">
  <span class="brandName">경기도농업기술원</span>
  <img src="assets/경기도심볼.jpg" alt="로고" class="brandLogo"/>
</div>

<script>
const base="assets/videos";
const STANDARD_PATH=`${base}/mushroom_S1T18_H90_Lon_S2T15_H80_Lon_T10.mp4`;
const stdPlayer=document.getElementById("stdPlayer");
const cmpPlayer=document.getElementById("cmpPlayer");
const stdStatus=document.getElementById("stdStatus");
const cmpStatus=document.getElementById("cmpStatus");

let autoplayUnlocked=false;
async function unlockAutoplay(){
  if(autoplayUnlocked)return; autoplayUnlocked=true;
  for(const p of [stdPlayer,cmpPlayer]){
    try{p.muted=true;p.setAttribute('muted','');p.setAttribute('playsinline','');p.autoplay=true;await p.play();}catch{}
  }
}
['pointerdown','keydown','touchstart','visibilitychange'].forEach(e=>window.addEventListener(e,unlockAutoplay,{once:true}));

function logStatus(m){try{console.log("[MUSHROOM]",m);}catch{}}
const existsCache=new Map();
async function fileExistsSmart(relPath){
  const url=encodeURI(relPath);
  if(existsCache.has(url))return existsCache.get(url);
  try{const r=await fetch(url,{method:"HEAD",cache:"no-store"});if(r.ok){existsCache.set(url,true);return true;}}catch{}
  if(url.endsWith(".mp4")){
    const alt=url.slice(0,-4)+".MP4";
    try{const r2=await fetch(alt,{method:"HEAD",cache:"no-store"});if(r2.ok){existsCache.set(alt,true);return alt;}}catch{}
  }
  if(!/\/converted\//.test(url)){
    const conv=url.replace("/aging/","/aging/converted/");
    try{const r3=await fetch(conv,{method:"HEAD",cache:"no-store"});if(r3.ok){existsCache.set(conv,true);return conv;}}catch{}
  }
  existsCache.set(url,"force");return"force";
}
const withCacheBuster=abs=>{const u=new URL(abs,location.href);u.searchParams.set("v",Date.now());return u.toString();};
async function loadToPlayer(player,statusEl,relPath){
  let url=relPath;
  const test=await fileExistsSmart(relPath);
  if(test===true){}else if(typeof test==="string"&&test!=="force"){url=test;}else if(test==="force"){logStatus(`HEAD 실패 → 강제 로드:${relPath}`);}else{
    statusEl.innerHTML=`파일없음:<code>${relPath}</code>`;player.removeAttribute("src");player.load();return false;
  }
  try{player.pause();}catch{}
  player.removeAttribute("src");player.load();
  player.muted=true;player.setAttribute('muted','');player.setAttribute('playsinline','');player.autoplay=true;
  const finalUrl=withCacheBuster(url);
  player.src=finalUrl;
  player.onerror=()=>{statusEl.innerHTML=`재생 오류:<code>${finalUrl}</code>`;};
  player.oncanplay=()=>{statusEl.textContent=`재생 중:${finalUrl}`;};
  try{await player.play();}catch{statusEl.innerHTML=`자동재생 차단됨→<b>재생</b>버튼 클릭`; }
  return true;
}

const selAging=document.getElementById("aging");
const selQual=document.getElementById("quality");
async function updateCompare(){
  let relPath="";
  if(selQual.value!=="none")relPath=`${base}/quality/${selQual.value}.mp4`;
  else if(selAging.value==="15"||selAging.value==="18")relPath=`${base}/aging/aging-${selAging.value}.mp4`;
  else relPath=STANDARD_PATH;
  await loadToPlayer(cmpPlayer,cmpStatus,relPath);
  unlockAutoplay();
}
["change"].forEach(evt=>{
  selAging.addEventListener(evt,updateCompare);
  selQual.addEventListener(evt,updateCompare);
});
(async()=>{await loadToPlayer(stdPlayer,stdStatus,STANDARD_PATH);await updateCompare();})();
</script>
</body>
</html>
