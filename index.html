<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>버섯 생육 시뮬레이션 뷰어 (Layout Refit)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{
  --bg:#0b0e11; --card:#141a20; --line:#213040; --text:#e9f0f5; --muted:#9fb0c0; --panel:#0e1319;
  --radius:14px; --inc:4pt;
  --header-h:72px; --gap:14px;
  --video-w:clamp(20cm,22cm,25cm);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,"Noto Sans KR";
  overflow:hidden;
}

/* ===== 헤더 ===== */
header{
  height:var(--header-h);
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;border-bottom:1px solid #16202a;
}
h1{margin:0;font-size:calc(26px + var(--inc));}
.sub{color:var(--muted);font-size:calc(13px + var(--inc)/2);}
.toolbar{display:flex;gap:10px;}
.btn{
  padding:8px 12px;border-radius:10px;border:1px solid #2a3847;
  background:#0f141a;color:var(--text);cursor:pointer;
}
.btn:hover{border-color:#415e7a;}

/* ===== 메인 레이아웃 ===== */
main{
  display:grid;
  grid-template-columns: 28% 50% 22%;
  height:calc(100vh - var(--header-h));
  gap:var(--gap);
  padding:var(--gap);
  overflow:hidden;
  align-items:stretch;
}

/* ===== 좌측 환경설정 패널 ===== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;overflow:auto;
}
h2{margin:8px 0;font-size:calc(15px + var(--inc));}
label{font-size:calc(13px + var(--inc)/2);color:var(--muted);}
select{
  width:100%;padding:6px 8px;border-radius:8px;
  background:#0f141a;color:#fff;border:1px solid #2a3847;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.hint{font-size:12px;color:var(--muted);margin-top:8px;}

/* ===== 중앙 플레이어 ===== */
.stack{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:var(--gap);
  background:#0f141a;border-radius:var(--radius);
  border:1px solid #25374a;padding:10px;
}
.vcard{
  display:flex;flex-direction:column;background:#101821;border-radius:12px;border:1px solid #25374a;
  padding:8px;
}
.vtitle{color:#cfe1f3;margin-bottom:6px;font-size:15px;}
.vmedia{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden;}
.vw{width:var(--video-w);max-width:100%;height:100%;display:flex;justify-content:center;align-items:center;}
.vw video{width:100%;height:100%;object-fit:contain;border-radius:10px;background:#000;}
.status{font-size:12px;color:var(--muted);min-height:1.2em;}

/* ===== 우측 표준 매뉴얼 ===== */
.sidepanel{
  background:var(--panel);
  border:1px solid #1e2a36;
  border-radius:var(--radius);
  padding:10px;
  overflow:auto;
}
.sidepanel h3{margin:6px 0;font-size:15px;}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.imgs img{width:100%;border-radius:8px;border:1px solid #25374a;}
.kv{display:grid;grid-template-columns:90px 1fr;color:#b1c0cf;font-size:13px;margin-top:4px;}
.kv b{color:#e8f1f8;}

/* ===== 브랜드 ===== */
.brandDock{
  position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:12px;
  background:rgba(20,26,32,0.85);border:1px solid #2a3847;padding:8px 12px;
  border-radius:12px;backdrop-filter:blur(3px);
}
.brandName{font-weight:800;font-size:calc(14px + var(--inc));color:#fff;}
.brandLogo{height:100px;object-fit:contain;border-radius:6px;}

@media(max-width:1200px){
  main{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto;}
  body{overflow:auto;}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>버섯 생육 시뮬레이션</h1>
    <div class="sub">좌: 환경 설정 · 중: 영상 비교 · 우: 표준 매뉴얼</div>
  </div>
  <div class="toolbar">
    <button id="openManual" class="btn">매뉴얼</button>
    <button id="playBoth" class="btn">재생</button>
    <button id="pauseBoth" class="btn">정지</button>
    <button id="syncTime" class="btn">동기화</button>
  </div>
</header>

<main>
  <!-- 좌측 환경설정 -->
  <section class="card">
    <h2>Stage1</h2>
    <div class="row">
      <div><label>온도(°C)</label><select id="s1temp"><option>13</option><option selected>18</option><option>23</option></select></div>
      <div><label>광</label><select id="s1light"><option selected>on</option><option>off</option></select></div>
    </div>
    <h2>Stage2</h2>
    <div class="row">
      <div><label>온도(°C)</label><select id="s2temp"><option>15</option><option selected>18</option></select></div>
      <div><label>습도(%)</label><select id="s2hum"><option>60</option><option selected>80</option><option>90</option></select></div>
    </div>
    <h2>추가 보기</h2>
    <div class="row">
      <div><label>품질</label><select id="quality"><option value="none" selected>—</option><option value="quality_excellent">특상</option></select></div>
      <div><label>노화</label><select id="aging"><option value="none" selected>—</option><option value="15">aging-15</option><option value="18">aging-18</option></select></div>
    </div>
  </section>

  <!-- 중앙 영상 -->
  <section class="stack">
    <div class="vcard">
      <div class="vtitle">기준 플레이어</div>
      <div class="vmedia"><div class="vw"><video id="stdPlayer" controls muted autoplay playsinline webkit-playsinline></video></div></div>
      <div id="stdStatus" class="status"></div>
    </div>
    <div class="vcard">
      <div class="vtitle">비교 플레이어</div>
      <div class="vmedia"><div class="vw"><video id="cmpPlayer" controls muted autoplay playsinline webkit-playsinline></video></div></div>
      <div id="cmpStatus" class="status"></div>
    </div>
  </section>

  <!-- 우측 표준 매뉴얼 -->
  <aside class="sidepanel">
    <h3>표준 매뉴얼</h3>
    <div class="imgs">
      <img src="assets/입상(개봉) 1.jpg" alt="입상(개봉) 1">
      <img src="assets/입상(개봉) 2.jpg" alt="입상(개봉) 2">
    </div>
    <div class="kv"><b>설명</b><span>배지를 개봉하고 생육 준비 단계 시작</span></div>
  </aside>
</main>

<!-- 하단 브랜드 -->
<div class="brandDock">
  <span class="brandName">경기도농업기술원</span>
  <img src="assets/경기도심볼.jpg" alt="로고" class="brandLogo"/>
</div>

<script>
const base="assets/videos";
const STANDARD_PATH=`${base}/mushroom_S1T18_H90_Lon_S2T15_H80_Lon_T10.mp4`;
const stdPlayer=document.getElementById("stdPlayer");
const cmpPlayer=document.getElementById("cmpPlayer");
const stdStatus=document.getElementById("stdStatus");
const cmpStatus=document.getElementById("cmpStatus");

let autoplayUnlocked=false;
async function unlockAutoplay(){
  if(autoplayUnlocked)return;autoplayUnlocked=true;
  for(const p of [stdPlayer,cmpPlayer]){
    try{p.muted=true;p.setAttribute('muted','');p.setAttribute('playsinline','');p.autoplay=true;await p.play();}catch{}
  }
}
['pointerdown','keydown','touchstart','visibilitychange'].forEach(e=>window.addEventListener(e,unlockAutoplay,{once:true}));

async function fileExistsSmart(url){
  try{const r=await fetch(url,{method:"HEAD"});return r.ok;}catch{return false;}
}
const withCacheBuster=u=>u+"?v="+Date.now();

async function loadToPlayer(p,status,rel){
  const ok=await fileExistsSmart(rel);
  if(!ok){status.textContent="파일없음:"+rel;return;}
  p.src=withCacheBuster(rel);
  try{await p.play();status.textContent="재생:"+rel;}catch{status.textContent="자동재생 차단됨";}
}
async function updateCompare(){
  let rel="";
  const aging=document.getElementById("aging").value;
  const qual=document.getElementById("quality").value;
  if(qual!=="none")rel=`${base}/quality/${qual}.mp4`;
  else if(aging==="15"||aging==="18")rel=`${base}/aging/aging-${aging}.mp4`;
  else rel=STANDARD_PATH;
  await loadToPlayer(cmpPlayer,cmpStatus,rel);
}
document.getElementById("playBoth").onclick=()=>{stdPlayer.play();cmpPlayer.play();};
document.getElementById("pauseBoth").onclick=()=>{stdPlayer.pause();cmpPlayer.pause();};
document.getElementById("syncTime").onclick=()=>{cmpPlayer.currentTime=stdPlayer.currentTime;};
document.getElementById("aging").onchange=updateCompare;
document.getElementById("quality").onchange=updateCompare;

(async()=>{await loadToPlayer(stdPlayer,stdStatus,STANDARD_PATH);await updateCompare();})();
</script>
</body>
</html>
